# Vérification automatique : à chaque envoi sur GitHub, on lance les tests et on vérifie que le jeu se construit.
name: Vérification
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
